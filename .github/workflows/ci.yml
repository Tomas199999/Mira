name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # El esquema y las políticas de RLS se prueban contra un Postgres real,
      # no se asumen. Ver scripts/verify-schema.mjs.
      - name: Verificar esquema y RLS
        run: npm run verify:schema

      # El analizador de Supabase encontró lo que la suite propia no miraba.
      # Corre sólo si hay credenciales; en un fork simplemente se saltea.
      - name: Analizador de seguridad de Supabase
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx supabase db advisors --linked --type security

      - name: Verificar procesamiento de imagen y pipeline
        run: npm run verify:pipeline

      # Con la base vacía cualquier plan parece rápido. Esto genera volumen
      # realista y mide, que es lo único que detecta un índice inservible.
      - name: Verificar performance de las consultas calientes
        run: npm run verify:performance

      - name: Typecheck
        run: npm run typecheck

      # Que la app empaquete es parte de "no romper producción": un error de
      # resolución de módulos no lo detecta el typecheck.
      - name: Empaquetar la app móvil
        working-directory: apps/mobile
        run: npx expo export --platform ios --output-dir /tmp/bundle-check
